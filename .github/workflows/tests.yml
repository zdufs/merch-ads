name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The project's own platform. This is the job that must stay green.
  macos:
    name: Python engine (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # No credentials and no network needed: the suite uses temporary databases.
      # Loud "BULK WRITE FAILED" and "still PROCESSING" lines are simulated
      # failures inside passing tests. The summary line is what matters.
      - name: Run tests
        run: python -m unittest discover -s tests -p '*_tests.py' -t .

  # The engine has no macOS-only code, so it should run anywhere. This job proves
  # that and is allowed to fail without blocking a merge.
  linux:
    name: Python engine (Linux, informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -p '*_tests.py' -t .

# The Mac app is deliberately not built here. It targets macOS 26 with Swift 6, and
# GitHub's runner images lag that. Build it locally:
#   xcodebuild -project MerchAds.xcodeproj -scheme MerchAds -configuration Debug build
