name: Bug report
description: Something behaves differently from what the docs say.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting.

        **Before you paste anything:** remove your profile ids, your ASINs, your revenue
        figures, and anything from `.env`. `appctl.py health` output contains profile ids.

        Found a security problem? Do not use this form — see
        [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you run, and what did it do?
      placeholder: |
        I ran:  ADS_MARKET=UK python3 appctl.py metrics
        I got:  ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: health
    attributes:
      label: Output of `python3 appctl.py health`
      description: Run it WITHOUT ADS_MARKET. Remove your profile ids before pasting.
      render: json

  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.1"

  - type: input
    id: python
    attributes:
      label: Python version
      description: "`python3 --version`"
      placeholder: "3.11.9"

  - type: dropdown
    id: area
    attributes:
      label: Which part?
      options:
        - Python engine (phases, appctl)
        - Rules DSL
        - Mac app
        - Setup / credentials
        - Documentation
        - Not sure
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I read [TROUBLESHOOTING.md](../blob/main/docs/TROUBLESHOOTING.md)
          required: true
        - label: I removed my profile ids, ASINs and revenue figures from everything above
          required: true
